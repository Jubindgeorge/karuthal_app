<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karuthal - Customer Login & Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { firebaseConfig } from "./app.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Make auth functions globally accessible
    window.authInstance = auth;
    window.dbInstance = db;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    window.doc = doc;
    window.setDoc = setDoc;
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-6">

  <div class="max-w-md w-full bg-white rounded-3xl border p-8 space-y-6 shadow-xl">
    <div class="text-center space-y-2">
      <div class="bg-emerald-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center mx-auto text-xl font-black shadow-md">
        K
      </div>
      <h2 id="formTitle" class="font-extrabold text-slate-900 text-xl">Customer Hub Login</h2>
      <p id="formSubtitle" class="text-xs text-slate-500">Sign in to manage your parents' care plans and live tracking.</p>
    </div>

    <!-- LOGIN / REGISTER FORM -->
    <div class="space-y-4 text-xs">
      <div id="nameFieldBox" class="hidden">
        <label class="block font-bold text-slate-700 mb-1">Full Name *</label>
        <input type="text" id="custFullName" placeholder="Jubin D George" class="w-full bg-slate-50 border rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-600">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Email *</label>
        <input type="email" id="custIdentifier" placeholder="email@example.com" class="w-full bg-slate-50 border rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-600">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Password *</label>
        <input type="password" id="custPassword" placeholder="••••••••" class="w-full bg-slate-50 border rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-600">
      </div>

      <button id="authSubmitBtn" onclick="handleCustomerAuth()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl shadow transition text-xs">Sign In</button>
      
      <div class="text-center pt-2 space-y-2">
        <p id="toggleText" class="text-slate-500">Don't have an account? <span onclick="toggleAuthMode()" class="text-emerald-600 font-bold cursor-pointer hover:underline">Create Account</span></p>
        <a href="index.html" class="block text-slate-400 hover:underline">&larr; Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    let isRegisterMode = false;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('formTitle');
      const subtitle = document.getElementById('formSubtitle');
      const nameBox = document.getElementById('nameFieldBox');
      const btn = document.getElementById('authSubmitBtn');
      const toggleText = document.getElementById('toggleText');

      if (isRegisterMode) {
        title.innerText = "Create Customer Account";
        subtitle.innerText = "Register to start managing your family care plans.";
        nameBox.classList.remove('hidden');
        btn.innerText = "Register & Continue";
        toggleText.innerHTML = `Already have an account? <span onclick="toggleAuthMode()" class="text-emerald-600 font-bold cursor-pointer hover:underline">Sign In</span>`;
      } else {
        title.innerText = "Customer Hub Login";
        subtitle.innerText = "Sign in to manage your parents' care plans and live tracking.";
        nameBox.classList.add('hidden');
        btn.innerText = "Sign In";
        toggleText.innerHTML = `Don't have an account? <span onclick="toggleAuthMode()" class="text-emerald-600 font-bold cursor-pointer hover:underline">Create Account</span>`;
      }
    }

    async function handleCustomerAuth() {
      const identifier = document.getElementById('custIdentifier').value.trim();
      const password = document.getElementById('custPassword').value.trim();
      const fullName = document.getElementById('custFullName').value.trim();

      if (!identifier || !password) {
        alert("Please fill all required fields.");
        return;
      }

      const auth = window.authInstance;
      const db = window.dbInstance;

      if (isRegisterMode) {
        if (!fullName) {
          alert("Please enter your full name.");
          return;
        }

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, identifier, password);
          const user = userCredential.user;

          await setDoc(doc(db, "customers", user.uid), {
            id: user.uid,
            name: fullName,
            email: identifier
          });

          localStorage.setItem('karuthal_customer_session', JSON.stringify({ name: fullName, identifier: user.uid }));
          alert("Account created successfully!");
          location.href = 'customer-dashboard.html';
        } catch (error) {
          alert(error.message);
        }
      } else {
        try {
          const userCredential = await signInWithEmailAndPassword(auth, identifier, password);
          const user = userCredential.user;

          localStorage.setItem('karuthal_customer_session', JSON.stringify({ identifier: user.uid }));
          alert("Login successful!");
          location.href = 'customer-dashboard.html';
        } catch (error) {
          alert(error.message);
        }
      }
    }
  </script>
</body>
</html>
