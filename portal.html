<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- നിങ്ങളുടെ നിലവിലുള്ള HTML എലിമെന്റുകളും UI ഡിസൈനും ഇവിടെ കൃത്യമായി നിലനിൽക്കും -->
  <div id="portalApp">
    <!-- UI Elements for Portal -->
  </div>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      onSnapshot, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 1. Firebase Authentication Check
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("Logged in user:", user.email);
        initRealtimeSync();
      } else {
        // ലോഗിൻ ചെയ്തിട്ടില്ലെങ്കിൽ index.html ലേക്ക് റീഡയറക്ട് ചെയ്യും
        window.location.href = "index.html";
      }
    });

    // 2. Real-time Firestore Data Synchronization (Customer Packages)
    function initRealtimeSync() {
      const packagesRef = collection(db, "packages");

      // റിയൽ-ടൈം മാറ്റങ്ങൾ തത്സമയം അറിയാൻ onSnapshot ഉപയോഗിക്കുന്നു
      onSnapshot(packagesRef, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === "added" || change.type === "modified") {
            const packageData = change.doc.data();
            const packageId = change.doc.id;
            
            // നിങ്ങളുടെ HTML UI-ൽ പാക്കേജ് ഡാറ്റ അപ്‌ഡേറ്റ് ചെയ്യുന്ന ഫങ്ഷൻ
            updatePackageUI(packageId, packageData);
          }
        });
      });
    }

    // Customer Package അപ്‌ഡേറ്റ് ചെയ്യാനുള്ള ഫങ്ഷൻ
    async function updateCustomerPackage(packageId, newData) {
      try {
        const pkgRef = doc(db, "packages", packageId);
        await updateDoc(pkgRef, newData);
        console.log("Package updated successfully");
      } catch (error) {
        console.error("Error updating package:", error);
      }
    }

    function updatePackageUI(id, data) {
      // DOM എലിമെന്റുകളിലേക്ക് ഫയർബേസ് ഡാറ്റ റെൻഡർ ചെയ്യുക
    }
  </script>
</body>
</html>
